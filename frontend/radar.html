<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radar - WX-Plumes</title>
    <meta name="description" content="Live weather radar across the US from NOAA MRMS, sharpened by the local NEXRAD radars every 2 minutes, with a 60-minute nowcast.">
    <!-- Link previews and search: __ORIGIN__ is the site's own address (nginx fills it in) -->
    <link rel="canonical" href="__ORIGIN__/radar">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WX-Plumes">
    <meta property="og:title" content="Radar - WX-Plumes">
    <meta property="og:description" content="Live weather radar across the US from NOAA MRMS, sharpened by the local NEXRAD radars every 2 minutes, with a 60-minute nowcast.">
    <meta property="og:url" content="__ORIGIN__/radar">
    <meta property="og:image" content="__ORIGIN__/icons/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="WX-Plumes: a spiral of the last 24 hours and the next 24, colored by temperature">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Radar - WX-Plumes">
    <meta name="twitter:description" content="Live weather radar across the US from NOAA MRMS, sharpened by the local NEXRAD radars every 2 minutes, with a 60-minute nowcast.">
    <meta name="twitter:image" content="__ORIGIN__/icons/og.jpg">

    <!-- Icons -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">

    <!-- MapLibre GL (self-hosted) -->
    <link rel="stylesheet" href="/vendor/maplibre-gl.css">
    <script defer src="/vendor/maplibre-gl.js"></script>

    <link rel="stylesheet" href="/css/radar.css?v=__V__">

    <link rel="preload" href="/fonts/anybody-latin.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" id="themeColor" content="#151413">

    <!-- Theme before first paint: an embed's ?theme= (the overview's), else the saved choice, else the system's -->
    <script>
        try {
            const q = new URLSearchParams(location.search).get('theme');
            document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q
                : localStorage.getItem('sref-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch { document.documentElement.dataset.theme = 'dark'; }
        if (document.documentElement.dataset.theme === 'light') document.getElementById('themeColor').content = '#f3f0e8';
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=__V__').catch(() => { });
            });
        }
    </script>
</head>

<body class="radar-page">
    <div id="map"></div>

    <header class="radar-header">
        <a href="/" class="nav-link back-link"><span class="caret" data-dir="left"></span>Weather</a>
        <a href="/plumes" class="nav-link plumes-link">Plumes</a>
        <div class="radar-title">Radar</div>
        <div class="radar-updated" id="radarUpdated"></div>
        <button id="themeBtn" class="nav-link theme-btn" aria-label="Switch theme"></button>
    </header>

    <!-- Colors mirror the TWC table (extractor RAIN_HEX/SNOW_HEX, which paints MRMS and the model
         radar; LibreWXR fallback TILE_STYLE 4/1_1): 5 dBZ bands, 5-80, rain clear below 10.
         MRMS has no precip type: radar.js sets data-source="mrms" and radar.css drops the Snow row.
         Rates: Marshall-Palmer Z=200R^1.6 for rain, Z=2000S^2 at 10:1 for snow (both approximate). -->
    <details class="radar-legend" id="legend" data-overlay="radar" open>
        <summary class="legend-toggle"><span id="overlayName" class="overlay-name">Radar</span><span class="caret"></span></summary>
        <div class="legend-body">
            <select id="overlaySelect" class="overlay-select" aria-label="Map overlay">
                <option value="radar">Radar</option>
                <option value="satellite">Satellite</option>
                <option value="both">Radar + satellite</option>
                <option value="temp">Temperature</option>
                <option value="dewpoint">Dew point</option>
                <option value="wind">Wind</option>
                <option value="gust">Wind gusts</option>
                <option value="clouds">Clouds</option>
                <option value="precip">Precip total</option>
                <option value="snow">Snow total</option>
            </select>
            <div class="legend-grid legend-precip">
                <span>Rain</span><i class="legend-bar rain"></i>
                <span></span>
                <div class="legend-axis">
                    <span style="left: 20%">.03</span><span style="left: 33.33%">.1</span><span style="left: 46.67%">.5</span><span style="left: 60%">2</span>
                </div>
                <span>Snow</span><i class="legend-bar snow"></i>
                <span></span>
                <div class="legend-axis">
                    <span style="left: 6.67%">.03</span><span style="left: 20%">.1</span><span style="left: 33.33%">.3</span><span style="left: 46.67%">1</span>
                </div>
            </div>
            <div class="legend-caption legend-precip">Inches per hour (approx.)</div>
            <!-- Filled from the extractor's palette (radar.js renderFieldLegend) -->
            <div class="legend-grid legend-field">
                <span id="fieldUnit"></span><i class="legend-bar" id="fieldBar"></i>
                <span></span>
                <div class="legend-axis" id="fieldAxis"></div>
            </div>
            <div class="legend-caption legend-field" id="fieldCaption"></div>
            <div class="legend-caption legend-sat">Satellite: brighter = thicker, colder cloud tops</div>
            <div class="legend-caption legend-model">Simulated by the RRFS 3 km model</div>
        </div>
    </details>

    <div class="radar-controls">
        <button id="playBtn" class="play-btn" title="Play/pause animation" aria-label="Play animation"></button>
        <button id="speedBtn" class="speed-btn" title="Animation speed" aria-label="Animation speed">1x</button>
        <button id="rangeBtn" class="speed-btn range-btn" aria-label="Time range">Now</button>
        <div class="scrubber-wrap">
            <input type="range" id="scrubber" min="0" max="0" value="0" step="1" aria-label="Radar frame time">
            <div class="scrubber-labels">
                <span id="frameTime" class="frame-time">Loading radar&hellip;</span>
                <span id="frameBadge" class="frame-badge"></span>
            </div>
        </div>
    </div>

    <script type="module" src="/js/radar.js?v=__V__"></script>
</body>

</html>

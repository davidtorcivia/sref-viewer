<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Weather</title>
    <meta name="description" content="Observed conditions and hourly forecasts for your places">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/css/overview.css?v=__V__">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f3f0e8">
    <link rel="preload" href="/fonts/anybody-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=__V__').catch(() => { });
            });
        }
    </script>
</head>

<body>
    <header class="sg-nav" id="header">
        <nav class="sg-chips" id="chips" aria-label="Places"></nav>
        <div class="sg-nav-actions">
            <button class="sg-find" id="searchBtn" aria-label="Find a place">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#i-search" /></svg><span>Find a place</span>
            </button>
            <a href="/radar" class="wx-icon-btn" aria-label="Radar map">
                <svg class="ic" aria-hidden="true"><use href="#i-radar" /></svg>
            </a>
            <button class="wx-icon-btn" id="settingsBtn" aria-label="Settings">
                <svg class="ic" aria-hidden="true"><use href="#i-gear" /></svg>
            </button>
        </div>
    </header>

    <main id="view" class="wx-main"></main>

    <dialog id="searchDialog" class="wx-sheet" aria-label="Search places">
        <form class="wx-search">
            <label class="wx-field">
                <svg class="ic ic-sm"><use href="#i-search" /></svg>
                <input id="searchInput" type="search" placeholder="City, ZIP code or street address" autocomplete="off"
                    aria-label="Search places" enterkeyhint="search">
            </label>
            <button type="button" class="wx-cancel" id="searchCancel">Cancel</button>
        </form>
        <ul id="searchResults" class="wx-results"></ul>
        <p class="wx-sheet-note">Forecasts resolve to about 2.5 km: an address picks the neighborhood.</p>
    </dialog>

    <dialog id="settingsDialog" class="wx-sheet wx-settings" aria-label="Settings">
        <div class="settings-card">
            <div class="settings-head">
                <h2>Settings</h2>
                <button type="button" class="wx-cancel settings-done">Done</button>
            </div>
            <div class="settings-body"></div>
            <p class="settings-note">Saved on this device.</p>
        </div>
    </dialog>

    <dialog id="detailDialog" class="wx-sheet wx-detail" aria-labelledby="detailTitle">
        <div class="settings-card detail-card">
            <div class="settings-head">
                <h2 class="detail-title" id="detailTitle"></h2>
                <button type="button" class="wx-cancel detail-done">Done</button>
            </div>
            <div class="detail-body"></div>
        </div>
    </dialog>

    <!-- Line icons. Colored parts read --sun/--moon/--drop/--flake/--bolt, which
         reach inside <use> because custom properties inherit. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <g id="g-cloud"><path d="M7.5 17.3h9.2a3.8 3.8 0 0 0 .5-7.57 5.6 5.6 0 0 0-10.6-1A4.3 4.3 0 0 0 7.5 17.3z" /></g>
            <g id="g-cloud-up"><path d="M7.5 15h9.2a3.8 3.8 0 0 0 .5-7.57 5.6 5.6 0 0 0-10.6-1A4.3 4.3 0 0 0 7.5 15z" /></g>
        </defs>
        <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" stroke="var(--sun, currentColor)" fill="var(--sun, none)" fill-opacity=".25" />
            <path stroke="var(--sun, currentColor)" d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5" />
        </symbol>
        <symbol id="i-clear-night" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round">
            <path stroke="var(--moon, currentColor)" fill="var(--moon, none)" fill-opacity=".2" d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z" />
        </symbol>
        <symbol id="i-partly" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8.5" r="3.2" stroke="var(--sun, currentColor)" />
            <path stroke="var(--sun, currentColor)" d="M9 2.6v1.2M3.1 8.5h1.2M4.8 4.3l.9.9M13.2 4.3l-.9.9" />
            <use href="#g-cloud" stroke="currentColor" fill="var(--cloud-fill, none)" transform="translate(2 1.5) scale(.92)" />
        </symbol>
        <symbol id="i-partly-night" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round">
            <path stroke="var(--moon, currentColor)" d="M13.5 8.6A4.6 4.6 0 0 1 7.4 2.5a4.6 4.6 0 1 0 6.1 6.1z" />
            <use href="#g-cloud" stroke="currentColor" fill="var(--cloud-fill, none)" transform="translate(2 1.5) scale(.92)" />
        </symbol>
        <symbol id="i-cloudy" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round">
            <use href="#g-cloud" stroke="currentColor" fill="var(--cloud-fill, none)" />
        </symbol>
        <symbol id="i-rain" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <use href="#g-cloud-up" stroke="currentColor" fill="var(--cloud-fill, none)" />
            <path stroke="var(--drop, currentColor)" d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5" />
        </symbol>
        <symbol id="i-snow" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <use href="#g-cloud-up" stroke="currentColor" fill="var(--cloud-fill, none)" />
            <g fill="var(--flake, currentColor)" stroke="none">
                <circle cx="8" cy="18.6" r="1.1" /><circle cx="12" cy="20.4" r="1.1" /><circle cx="16" cy="18.6" r="1.1" />
            </g>
        </symbol>
        <symbol id="i-storm" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <use href="#g-cloud-up" stroke="currentColor" fill="var(--cloud-fill, none)" />
            <path stroke="var(--bolt, currentColor)" fill="var(--bolt, none)" fill-opacity=".3" d="M12.8 15.5l-2.6 3.6h2.6l-1.6 3.2" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-locate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20 4L4 11l7 2 2 7z" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.2" /><path d="M15.2 15.2L20 20" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5L8 12l6.5 6.5" />
        </symbol>
        <symbol id="i-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" opacity=".55" /><path d="M12 12L18.4 5.6" /><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" /><circle cx="12" cy="10" r="2.3" />
        </symbol>
        <symbol id="i-city" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M3.5 20.5h17M5 20.5V10l4-2v12.5M9 20.5V5.5l6-2.5v17.5M15 20.5V11l4 1.5v8" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
        </symbol>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M10.3 3h3.4l.5 2.4 1.9 1.1 2.3-.8 1.7 2.9-1.8 1.6v2.2l1.8 1.6-1.7 2.9-2.3-.8-1.9 1.1-.5 2.4h-3.4l-.5-2.4-1.9-1.1-2.3.8-1.7-2.9 1.8-1.6v-2.2L4.1 8.6l1.7-2.9 2.3.8 1.9-1.1z" />
            <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4.5h5v5M9.5 19.5h-5v-5M19.5 4.5l-6 6M4.5 19.5l6-6" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16M6 14l6 6 6-6" />
        </symbol>
    </svg>

    <script type="module" src="/js/overview.js?v=__V__"></script>
</body>

</html>

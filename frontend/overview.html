<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WX-Plumes</title>
    <meta name="description" content="Hyperlocal weather for your places: the last 24 hours observed and the next 24 forecast on one spiral, hourly and 11-day forecasts, alerts, radar and ensemble plumes.">

    <link rel="canonical" href="__ORIGIN__/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WX-Plumes">
    <meta property="og:title" content="WX-Plumes">
    <meta property="og:description" content="Hyperlocal weather for your places: the last 24 hours observed and the next 24 forecast on one spiral, hourly and 11-day forecasts, alerts, radar and ensemble plumes.">
    <meta property="og:url" content="__ORIGIN__/">
    <meta property="og:image" content="__ORIGIN__/icons/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="WX-Plumes: a spiral of the last 24 hours and the next 24, colored by temperature">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="WX-Plumes">
    <meta name="twitter:description" content="Hyperlocal weather for your places: the last 24 hours observed and the next 24 forecast on one spiral, hourly and 11-day forecasts, alerts, radar and ensemble plumes.">
    <meta name="twitter:image" content="__ORIGIN__/icons/og.jpg">
    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "WX-Plumes", "url": "__ORIGIN__/", "description": "Hyperlocal weather: observed conditions, hourly and 11-day forecasts, radar and ensemble plumes."}</script>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/css/overview.css?v=__V__">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f3f0e8">
    <!-- Theme before first paint: saved choice, else the system's -->
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('sref-theme')
                || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch { document.documentElement.dataset.theme = 'light'; }
        if (document.documentElement.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#151413';
    </script>
    <link rel="preload" href="/fonts/anybody-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- The first place's forecast, asked for while the scripts load (overview.js takes it) -->
    <script>
        try {
            const m = location.hash.match(/^#p=(.+)$/);
            const ps = JSON.parse(localStorage.getItem('wx-places')) || [{ id: 'nyc', lat: 40.7128, lon: -74.006 }];
            const p = (m && ps.find(x => x.id === decodeURIComponent(m[1]))) || ps[0];
            if (p) {
                const url = `/api/forecast?lat=${p.lat.toFixed(4)}&lon=${p.lon.toFixed(4)}`;
                window.earlyForecast = { url, res: fetch(url) };
            }
        } catch { /* overview.js asks itself */ }
    </script>
    <!-- overview.js's imports: fetched alongside it, not after it parses -->
    <link rel="modulepreload" href="/js/overview.js?v=__V__">
    <link rel="modulepreload" href="/js/config.js?v=__V__">
    <link rel="modulepreload" href="/js/site.js?v=__V__">
    <link rel="modulepreload" href="/js/forecast.js?v=__V__">
    <link rel="modulepreload" href="/js/signal.js?v=__V__">
    <link rel="modulepreload" href="/js/units.js?v=__V__">
    <link rel="modulepreload" href="/js/zone.js?v=__V__">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=__V__').catch(() => { });
            });
        }
    </script>
</head>

<body>
    <header class="sg-nav" id="header">
        <nav class="sg-chips" id="chips" aria-label="Places"></nav>
        <div class="sg-nav-actions">
            <button class="sg-find" id="searchBtn" aria-label="Find a place">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#i-search" /></svg><span>Find a place</span>
            </button>
            <a href="/radar" class="wx-icon-btn" aria-label="Radar map">
                <svg class="ic" aria-hidden="true"><use href="#i-radar" /></svg>
            </a>
            <button class="wx-icon-btn" id="themeBtn" aria-label="Switch theme"></button>
            <button class="wx-icon-btn" id="settingsBtn" aria-label="Settings">
                <svg class="ic" aria-hidden="true"><use href="#i-gear" /></svg>
            </button>
        </div>
    </header>

    <main id="view" class="wx-main"></main>

    <dialog id="searchDialog" class="wx-sheet" aria-label="Search places">
        <form class="wx-search">
            <label class="wx-field">
                <svg class="ic ic-sm"><use href="#i-search" /></svg>
                <input id="searchInput" type="search" placeholder="City, ZIP code or street address" autocomplete="off"
                    aria-label="Search places" enterkeyhint="search"
                    title="Forecasts resolve to about 2.5 km: an address picks the neighborhood.">
            </label>
            <button type="button" class="wx-cancel" id="searchCancel">Cancel</button>
        </form>
        <ul id="searchResults" class="wx-results"></ul>
    </dialog>

    <dialog id="settingsDialog" class="wx-sheet wx-settings" aria-label="Settings">
        <div class="settings-card">
            <div class="settings-head">
                <h2>Settings</h2>
                <button type="button" class="wx-cancel settings-done">Done</button>
            </div>
            <div class="settings-body"></div>
        </div>
    </dialog>


    <!-- Icons: UI line icons in currentColor; the weather glyphs are solid, in the --wx-* colors -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <!-- Weather glyphs: solid shapes in the --wx-* colors; a cloud is opaque, so what sits
             behind it (the sun, the moon) is hidden where they overlap -->
        <defs>
            <path id="g-cloud" d="M7 20h10.6a4.4 4.4 0 0 0 .5-8.77A6.3 6.3 0 0 0 6.1 10.4 4.8 4.8 0 0 0 7 20z" />
            <path id="g-cloud-up" d="M7 16.4h10.6a4.4 4.4 0 0 0 .5-8.77A6.3 6.3 0 0 0 6.1 6.8 4.8 4.8 0 0 0 7 16.4z" />
            <g id="g-rays" stroke-width="2.1" stroke-linecap="round">
                <path d="M12 1.6v2.3M12 20.1v2.3M1.6 12h2.3M20.1 12h2.3M4.65 4.65l1.6 1.6M17.75 17.75l1.6 1.6M4.65 19.35l1.6-1.6M17.75 6.25l1.6-1.6" />
            </g>
        </defs>
        <symbol id="i-clear" viewBox="0 0 24 24">
            <use href="#g-rays" stroke="var(--wx-sun)" />
            <circle cx="12" cy="12" r="5.3" fill="var(--wx-sun)" />
        </symbol>
        <symbol id="i-clear-night" viewBox="0 0 24 24">
            <path fill="var(--wx-moon)" d="M20.3 14.9A8.6 8.6 0 0 1 9.1 3.7a8.6 8.6 0 1 0 11.2 11.2z" />
        </symbol>
        <symbol id="i-partly" viewBox="0 0 24 24">
            <g transform="translate(.1 -.4) scale(.7)"><use href="#g-rays" stroke="var(--wx-sun)" /><circle cx="12" cy="12" r="5.3" fill="var(--wx-sun)" /></g>
            <use href="#g-cloud" fill="var(--wx-cloud)" transform="translate(1.6 .6) scale(.93)" />
        </symbol>
        <symbol id="i-partly-night" viewBox="0 0 24 24">
            <path fill="var(--wx-moon)" d="M13.6 9.6A6 6 0 0 1 5.8 1.8a6 6 0 1 0 7.8 7.8z" />
            <use href="#g-cloud" fill="var(--wx-cloud)" transform="translate(1.6 .6) scale(.93)" />
        </symbol>
        <symbol id="i-cloudy" viewBox="0 0 24 24">
            <use href="#g-cloud" fill="var(--wx-cloud-back)" transform="translate(5.2 -4.2) scale(.8)" />
            <use href="#g-cloud" fill="var(--wx-cloud)" transform="translate(-1.2 .3)" />
        </symbol>
        <symbol id="i-rain" viewBox="0 0 24 24">
            <use href="#g-cloud-up" fill="var(--wx-cloud-wet)" />
            <g fill="var(--c-rain)">
                <path d="M8.2 17.6c.9 1.3 1.5 2.3 1.5 3.1a1.5 1.5 0 0 1-3 0c0-.8.6-1.8 1.5-3.1z" />
                <path d="M12.4 17.6c.9 1.3 1.5 2.3 1.5 3.1a1.5 1.5 0 0 1-3 0c0-.8.6-1.8 1.5-3.1z" />
                <path d="M16.6 17.6c.9 1.3 1.5 2.3 1.5 3.1a1.5 1.5 0 0 1-3 0c0-.8.6-1.8 1.5-3.1z" />
            </g>
        </symbol>
        <symbol id="i-snow" viewBox="0 0 24 24">
            <use href="#g-cloud-up" fill="var(--wx-cloud-wet)" />
            <g stroke="var(--wx-snow)" stroke-width="1.5" stroke-linecap="round">
                <path d="M8.2 17.6v4.2M6.4 18.65l3.6 2.1M6.4 20.75l3.6-2.1" />
                <path d="M15.8 17.6v4.2M14 18.65l3.6 2.1M14 20.75l3.6-2.1" />
            </g>
        </symbol>
        <symbol id="i-storm" viewBox="0 0 24 24">
            <use href="#g-cloud-up" fill="var(--wx-cloud-storm)" />
            <path fill="var(--wx-bolt)" d="M13.4 13.2l-4.3 5.6h3l-1.5 4.6 5-6.4h-3.1l1.9-3.8z" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-locate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20 4L4 11l7 2 2 7z" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.2" /><path d="M15.2 15.2L20 20" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5L8 12l6.5 6.5" />
        </symbol>
        <symbol id="i-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" opacity=".55" /><path d="M12 12L18.4 5.6" /><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" /><circle cx="12" cy="10" r="2.3" />
        </symbol>
        <symbol id="i-city" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M3.5 20.5h17M5 20.5V10l4-2v12.5M9 20.5V5.5l6-2.5v17.5M15 20.5V11l4 1.5v8" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
        </symbol>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M10.3 3h3.4l.5 2.4 1.9 1.1 2.3-.8 1.7 2.9-1.8 1.6v2.2l1.8 1.6-1.7 2.9-2.3-.8-1.9 1.1-.5 2.4h-3.4l-.5-2.4-1.9-1.1-2.3.8-1.7-2.9 1.8-1.6v-2.2L4.1 8.6l1.7-2.9 2.3.8 1.9-1.1z" />
            <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4.5h5v5M9.5 19.5h-5v-5M19.5 4.5l-6 6M4.5 19.5l6-6" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" /><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
            <path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16M6 14l6 6 6-6" />
        </symbol>
    </svg>

    <script type="module" src="/js/overview.js?v=__V__"></script>
</body>

</html>

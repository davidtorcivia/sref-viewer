server {
    listen 80;
    listen [::]:80;   # healthcheck resolves localhost to ::1
    server_name localhost;
    server_tokens off;
    # Redirects stay relative: the port and scheme are the proxy's, not nginx's
    absolute_redirect off;

    root /usr/share/nginx/html;

    # Real client IP: behind Cloudflare/cloudflared/caddy the peer is a
    # private address, so take the rightmost untrusted X-Forwarded-For hop
    # (the one Cloudflare appended - clients can only forge hops left of it)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Inherited by every location below: cache lifetimes use `expires`,
    # because an add_header inside a location would drop these
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # HTML revalidates every load: it carries the asset version stamps
    location = /admin {
        expires epoch;
        try_files /admin.html =404;
    }

    location = /radar {
        expires epoch;
        try_files /radar.html =404;
    }

    # The weather overview is the main page; the plume viewer lives at /plumes
    location = / {
        # Plume links from before the move (/?station=...) go to the plume viewer
        if ($arg_station) { return 302 /plumes$is_args$args; }
        expires epoch;
        try_files /overview.html =404;
    }

    location = /plumes {
        expires epoch;
        try_files /index.html =404;
    }

    location = /overview {
        return 301 /$is_args$args;
    }

    # Uploaded favicon (URL is versioned on upload)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        expires 7d;
    }

    # ^~ so the static-asset regex below cannot capture /api/radar/tile/*.png
    location ^~ /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        client_max_body_size 2m;   # matches the backend's favicon upload limit
        proxy_set_header Host $host;
        # Resolved client IP only: the backend trusts exactly one hop
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold REFS cycle streams ~350MB upstream before answering
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;   # above the backend's 120s so its 502 wins
    }

    location = /health {
        proxy_pass http://backend:3001/health;
    }

    # Vendored libraries are pinned versions - safe to cache long
    # (^~ so the asset regex below doesn't override this)
    location ^~ /vendor/ {
        expires 30d;
    }

    location ~* \.html$ {
        expires epoch;
    }

    # The font changes almost never (before the rule below: the first matching regex wins)
    location ~* \.woff2$ {
        expires 30d;
    }

    # App assets have no content hashes: etag revalidation so deploys
    # reach clients on the next load. A ?v= URL is stamped per build (the
    # Dockerfile's __V__), so it never changes: cached outright, a phone opens
    # the page without a round trip per script.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest|json)$ {
        expires epoch;
        if ($arg_v) {
            expires 1y;
        }
    }

    # Catch-all - must be last: unknown paths get the overview
    location / {
        index overview.html;
        try_files $uri $uri/ /overview.html;
    }
}

server {
    listen 80;
    listen [::]:80;   # healthcheck resolves localhost to ::1
    server_name localhost;
    
    root /usr/share/nginx/html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    
    # Admin panel - MUST be before catch-all
    location = /admin {
        try_files /admin.html =404;
    }

    # Radar map page
    location = /radar {
        try_files /radar.html =404;
    }
    
    # Serve uploaded files from backend (^~ prevents regex match override)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Proxy API requests to backend (^~ so the static-asset regex below
    # cannot capture /api/radar/tile/*.png)
    location ^~ /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # A cold REFS cycle streams ~350MB upstream before answering
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;   # above the backend's 120s so its 502 wins
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://backend:3001/health;
    }
    
    # Vendored libraries are pinned versions - safe to cache long
    # (^~ so the asset regex below doesn't override this)
    location ^~ /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML must always revalidate - it carries the asset version stamps
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        etag on;
    }

    # App assets have no content hashes - use etag revalidation so
    # deploys reach clients on next load instead of being pinned for a day
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        add_header Cache-Control "no-cache";
        etag on;
    }
    
    # Catch-all for SPA - MUST be last
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

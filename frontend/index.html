<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NYC SREF Ensemble Plumes</title>
    <meta name="description" content="Interactive ensemble forecast plumes for NYC area airports from NOAA SREF model">

    <!-- Icons -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">

    <!-- Chart.js (self-hosted, deferred - executes in order before app.js module) -->
    <script defer src="/vendor/chart.umd.min.js"></script>
    <script defer src="/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script defer src="/vendor/chartjs-plugin-annotation.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.log('[SW] Registration failed:', err));
            });
        }
    </script>
</head>

<body>
    <header class="header">
        <div class="header-top">
            <div class="title" id="pageTitle">
                NYC SREF Ensemble Plumes
            </div>
            <nav class="header-nav">
                <a href="/radar" class="nav-link" title="Live radar map">Radar</a>
                <button class="btn help-btn" id="helpBtn" title="What is this?">?</button>
            </nav>
        </div>

        <div class="controls">
            <div class="btn-group" id="stationBtns">
                <button class="active" data-val="JFK">JFK</button>
                <button data-val="LGA">LGA</button>
                <button data-val="EWR">EWR</button>
                <input type="text" id="customStation" placeholder="ICAO" maxlength="4"
                    title="Enter any 4-letter ICAO airport code">
                <button id="customStationBtn" title="Load custom station">Go</button>
            </div>

            <input type="date" id="dateInput">

            <select id="runSelect">
                <option value="03">03Z</option>
                <option value="09">09Z</option>
                <option value="15">15Z</option>
                <option value="21">21Z</option>
            </select>

            <div class="time-display" id="timeDisplay">--:-- ET</div>

            <button class="btn" id="shareBtn" title="Copy link to clipboard">Share</button>
            <button class="btn" id="reloadBtn">Reload</button>
        </div>
    </header>

    <!-- Weather Summary Bar -->
    <div class="summary-bar" id="summaryBar">
        <span id="weatherSummary">Loading forecast...</span>
    </div>

    <main class="main" id="mainContent">
        <!-- Chart sections will be dynamically generated -->
    </main>

    <footer class="status-bar">
        <span id="status">Ready</span>
        <span id="lastUpdate"></span>
    </footer>

    <!-- Application Scripts (ES Modules) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>

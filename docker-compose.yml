services:
  frontend:
    build: ./frontend
    ports:
      - "8091:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .                      # shares frontend/js modules (see .dockerignore)
      dockerfile: backend/Dockerfile
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # Admin is disabled until this is set (in .env)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - EXTRACTOR_URL=http://extractor:3002
    volumes:
      - ./data:/app/data
    depends_on:
      - extractor
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  extractor:
    build: ./extractor
    expose:
      - "3002"
    environment:
      - PORT=3002
      # Sources default to the noaa-rrfs-ops-pds bucket; override with
      # RRFS_TAR_URL / REFS_GRIB_URL (see extractor.py) after the Oct 6 cutover
      - CACHE_DIR=/data/refs-cache
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3

services:
  frontend:
    build: ./frontend
    ports:
      - "8091:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - EXTRACTOR_URL=http://extractor:3002
    volumes:
      - /nvme-mirror/apps/sref-viewer/data:/app/data
    depends_on:
      - extractor
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  extractor:
    build: ./extractor
    expose:
      - "3002"
    environment:
      - PORT=3002
      # The experimental rrfs_a per-member BUFR feed went dark ~2026-08-12 and
      # the parallel/prod feeds publish no per-member files - see
      # REFS-MIGRATION.md "Status: BROKEN" before changing REFS_BUFR_URL.
      - CACHE_DIR=/data/refs-cache
    volumes:
      - /nvme-mirror/apps/sref-viewer/data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
